version: "3.8"

services:
  # ===== 后端服务 (FastAPI) =====
  backend:	# 后端
    build: .
    container_name: meeting-backend
    ports:
      - "8000:8000"
    env_file:
      - .env          # 从 .env 文件加载环境变量（ZHIPUAI_API_KEY）
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./.env:/app/.env   # 强制挂载 .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  # ===== 前端服务 (Streamlit) =====
  frontend:
    build: .
    container_name: meeting-frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    # 前端需要知道后端地址，这里用服务名 backend 作为主机名
    # Docker Compose 会自动解析服务名为容器 IP
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    command: streamlit run app/frontend.py --server.port 8501 --server.address 0.0.0.0
    restart: unless-stopped